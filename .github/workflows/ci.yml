name: CI

# Build + test + lint por componente do monorepo Horus (Fase 0 / T-004).
#
# Jobs: Java (5 módulos Quarkus), Python (`loadtest/`), Rust (`worker/`) e, depois deles,
# o e2e (T-1002) que sobe o stack real via docker compose e roda `scripts/e2e.sh`.
#
# Este pipeline NÃO depende de segredos (ao contrário do AI review): ele sempre
# roda e gateia os PRs com build/test reais. Usa o Maven Wrapper (`./mvnw`,
# fixado em Maven 3.9.9) para um build reproduzível sem depender de um mvn do host.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-java:
    name: Build, test & lint (Java / horus)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25 (Temurin) + cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build + test + lint (Maven Wrapper)
        # `verify` = compila + roda os testes (surefire). As flags de warning fazem
        # o papel de lint leve (deprecation/unchecked nas nossas fontes) sem `-Werror`,
        # para não quebrar o build por warnings vindos de libs no JDK 25.
        run: >-
          ./mvnw -B -ntp
          -Dmaven.compiler.showWarnings=true
          -Dmaven.compiler.showDeprecation=true
          verify

      - name: Publicar relatórios de teste (sempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  build-loadtest:
    name: Build & test (Python / loadtest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loadtest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv (gerencia Python + deps reproduzíveis)
        uses: astral-sh/setup-uv@v5

      - name: Criar venv (Python 3.13) + instalar deps de dev
        run: |
          uv venv --python 3.13 .venv
          uv pip install -e ".[dev]" --python .venv

      - name: Testes (pytest)
        run: .venv/bin/python -m pytest -q

  build-worker:
    name: Build, test & lint (Rust / worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable) + cache
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache de build (cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker

      - name: Formatação (rustfmt)
        run: cargo fmt --check

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build + testes
        run: cargo test

  e2e:
    name: E2E (stack real via docker compose)
    # Sobe infra + aplicações + LB (profile `apps`, T-1002) e roda scripts/e2e.sh: SAGA feliz e
    # compensada pelo Load Balancer, verificadas no Horus sobre Jaeger/Loki/Prometheus reais.
    # Pega regressões que os testes com dados sintéticos não pegam (ex.: T-507/T-905, T-1002).
    needs: [build-java, build-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml --profile apps
      # Só o necessário para o e2e (sem Grafana/exporters/cAdvisor/loadtest).
      E2E_SERVICES: >-
        postgres-prontuario postgres-payment postgres-invoice postgres-saga rabbitmq
        jaeger loki prometheus otel-collector
        prontuario-service payment-service invoice-service saga-orchestrator
        horus report-worker load-balancer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25 (Temurin) + cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Empacotar módulos Quarkus (target/quarkus-app)
        run: ./mvnw -B -ntp -DskipTests package

      - name: Subir o stack
        run: $COMPOSE up -d --build --wait --wait-timeout 600 $E2E_SERVICES

      - name: Teste ponta a ponta
        run: scripts/e2e.sh

      - name: Estado e logs do stack (em falha)
        if: failure()
        run: |
          $COMPOSE ps
          $COMPOSE logs --no-color --tail 200

      - name: Derrubar o stack
        if: always()
        run: $COMPOSE down -v

  ai-live:
    name: IA real por camada (opcional — requer a secret ANTHROPIC_API_KEY)
    # T-1003: exercita Haiku/Sonnet/Opus de verdade pelo Horus em modo live. Sem a secret, o job
    # é pulado com aviso (não bloqueia o CI). Não roda em PR (secrets não chegam a forks e evita
    # custo por push de branch).
    if: github.event_name != 'pull_request'
    needs: [build-java]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Porteiro da secret
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY ausente — smoke de IA real pulado"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup JDK 25 (Temurin) + cache Maven
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Empacotar e subir o Horus em modo live
        if: steps.gate.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HORUS_AI_ENABLED: "true"
        run: |
          ./mvnw -B -ntp -pl horus -am -DskipTests package
          nohup java -jar horus/target/quarkus-app/quarkus-run.jar > horus.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS localhost:8080/q/health/ready >/dev/null 2>&1 && break; sleep 2; done

      - name: Smoke por camada (FAST/BALANCED/DEEP)
        if: steps.gate.outputs.enabled == 'true'
        run: scripts/ai-smoke.sh

      - name: Log do Horus (em falha)
        if: failure() && steps.gate.outputs.enabled == 'true'
        run: cat horus.log
