# Horus — configuração base (bootstrap T-002).
# Capacidades reais (OTLP, correlação, IA) chegam nas Fases 5-7 do roadmap.

quarkus.application.name=horus

# HTTP
quarkus.http.port=8080

# Health: SmallRye expõe /q/health, /q/health/live e /q/health/ready.
quarkus.smallrye-health.root-path=/q/health

# Logs (JSON estruturado será habilitado com a telemetria — T-005 / Fase 4).
quarkus.log.level=INFO
quarkus.log.console.enable=true

# --- Backends de telemetria consultados pelo Horus (T-501, RF-H-014) ---
# URLs default = nomes de serviço do docker-compose (rede `horus`). Sobrescreva por
# env (QUARKUS_REST_CLIENT_JAEGER_URL, ...) ao rodar fora do compose.
quarkus.rest-client.jaeger.url=http://jaeger:16686
quarkus.rest-client.loki.url=http://loki:3100
quarkus.rest-client.prometheus.url=http://prometheus:9090
# Template LogQL de correlação por trace_id (placeholder %s); finalizado na validação T-405.
horus.query.loki.logql-template={service_namespace="medrec"} | trace_id="%s"
