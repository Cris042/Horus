# Horus — configuração base (bootstrap T-002).
# Capacidades reais (OTLP, correlação, IA) chegam nas Fases 5-7 do roadmap.

quarkus.application.name=horus

# HTTP
quarkus.http.port=8080

# Health: SmallRye expõe /q/health, /q/health/live e /q/health/ready.
quarkus.smallrye-health.root-path=/q/health

# Logs (JSON estruturado será habilitado com a telemetria — T-005 / Fase 4).
quarkus.log.level=INFO
quarkus.log.console.enable=true
