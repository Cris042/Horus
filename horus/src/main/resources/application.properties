# Horus — configuração base (bootstrap T-002).
# Capacidades reais (OTLP, correlação, IA) chegam nas Fases 5-7 do roadmap.

quarkus.application.name=horus

# HTTP
quarkus.http.port=8080

# Health: SmallRye expõe /q/health, /q/health/live e /q/health/ready.
quarkus.smallrye-health.root-path=/q/health

# Logs (JSON estruturado será habilitado com a telemetria — T-005 / Fase 4).
quarkus.log.level=INFO
quarkus.log.console.enable=true

# --- Backends de telemetria consultados pelo Horus (T-501, RF-H-014) ---
# URLs default = nomes de serviço do docker-compose (rede `horus`). Sobrescreva por
# env (QUARKUS_REST_CLIENT_JAEGER_URL, ...) ao rodar fora do compose.
quarkus.rest-client.jaeger.url=http://jaeger:16686
quarkus.rest-client.loki.url=http://loki:3100
quarkus.rest-client.prometheus.url=http://prometheus:9090
# Template LogQL de correlação por trace_id (placeholder %s); finalizado na validação T-405.
horus.query.loki.logql-template={service_namespace="medrec"} | trace_id="%s"
# Busca por janela temporal (T-1001): LogQL dos logs de erro e serviços internos do Jaeger
# ignorados quando a busca de traces não filtra por serviço.
horus.query.loki.error-logql={service_namespace="medrec"} | severity_text=~"(?i)(error|fatal)"
horus.query.jaeger.excluded-services=jaeger,jaeger-all-in-one,jaeger-query

# --- Camada de IA (SDK oficial da Anthropic — ADR-0011, T-601; adendo T-1003) ---
# Desligada por padrão: sem chave, o AnthropicLlmEngine responde em modo stub (app sobe e CI
# roda verde). Habilite em RUNTIME com horus.ai.enabled=true (env HORUS_AI_ENABLED) +
# ANTHROPIC_API_KEY. O modelo vem da camada de cada pedido (ModelTier: Haiku 4.5 / Sonnet 5 /
# Opus 5) — não há modelo global.
horus.ai.enabled=false
# Orçamento de tokens do montador de contexto da IA (T-602, RNF-H-003).
horus.ai.context.max-tokens=4000

# Resumo de estado agendado (T-603, RF-H-005). `off` desabilita; ex.: "0 0/15 * * * ?".
horus.ai.summary.cron=off
horus.ai.summary.promql=up
# Janela do resumo agendado e limites da coleta por janela (T-1001).
horus.ai.summary.lookback=15m
horus.ai.window.trace-limit=50
horus.ai.window.log-limit=50

# Cache de respostas do LLM (T-608, RNF-H-003/004) — reduz custo e latência.
horus.ai.cache.enabled=true
horus.ai.cache.max-entries=200
# Validade das respostas cacheadas (T-1012): a telemetria muda mesmo quando o prompt não muda.
horus.ai.cache.ttl=10m

# Trilha de auditoria do LLM (T-1004, RNF-H-006): registros retidos em memória para a API
# /horus/ai/audit; a trilha durável é o log da categoria `horus.ai.audit` (→ Loki).
horus.ai.audit.max-entries=500

# Análises assíncronas (T-1006, RNF-H-004): workers, fila (cheia → 429) e expiração dos jobs.
horus.ai.jobs.workers=2
horus.ai.jobs.queue=20
horus.ai.jobs.retention=1h

# --- Alertas do Horus (T-703, RF-H-013) ---
# Em anomalias/erros críticos o Horus resume via IA e dispara aos canais habilitados.
# O canal `log` está sempre ativo. Webhook e e-mail ativam quando configurados:
horus.alert.webhook.url=
# E-mail (T-1008): destinatários separados por vírgula; SMTP via QUARKUS_MAILER_HOST/PORT/
# USERNAME/PASSWORD/TLS e remetente QUARKUS_MAILER_FROM. Em dev/test o mailer é mock.
horus.alert.email.to=
quarkus.mailer.from=horus@medrec.local
# Disparo automático (T-1008): `off` desliga. Ex.: interval=1m, error-traces=5 e regras em
# horus.alert.watch.rules.<nome>.{promql,threshold,comparison,severity} (ver AlertWatchConfig).
horus.alert.watch.interval=off
horus.alert.watch.lookback=15m
horus.alert.watch.error-traces=0
horus.alert.watch.dedup-window=30m

# --- RBAC do Horus (T-704, RNF-H-010; autenticação real em T-1007) ---
# Ligado por padrão no perfil prod (imagem empacotada); desligado em dev/test. Papéis:
# PLATFORM_ADMIN, SRE, DEVELOPER, AUDITOR, LOAD_TEST_OP (ver docs/ROLES.md).
#   mode=jwt    → Authorization: Bearer <token do IdP>; papéis na claim `groups`; DEVELOPER com a
#                 claim `horus_services` só busca traces desses serviços. Verificação do token:
#                 MP_JWT_VERIFY_PUBLICKEY_LOCATION (URL do JWKS do IdP ou PEM) + MP_JWT_VERIFY_ISSUER.
#   mode=header → papel no cabeçalho X-Horus-Role, SEM prova de identidade — só dev/testes.
horus.rbac.enabled=false
%prod.horus.rbac.enabled=true
horus.rbac.mode=jwt
