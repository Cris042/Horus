# Horus — configuração base (bootstrap T-002).
# Capacidades reais (OTLP, correlação, IA) chegam nas Fases 5-7 do roadmap.

quarkus.application.name=horus

# HTTP
quarkus.http.port=8080

# Health: SmallRye expõe /q/health, /q/health/live e /q/health/ready.
quarkus.smallrye-health.root-path=/q/health

# Logs (JSON estruturado será habilitado com a telemetria — T-005 / Fase 4).
quarkus.log.level=INFO
quarkus.log.console.enable=true

# --- Backends de telemetria consultados pelo Horus (T-501, RF-H-014) ---
# URLs default = nomes de serviço do docker-compose (rede `horus`). Sobrescreva por
# env (QUARKUS_REST_CLIENT_JAEGER_URL, ...) ao rodar fora do compose.
quarkus.rest-client.jaeger.url=http://jaeger:16686
quarkus.rest-client.loki.url=http://loki:3100
quarkus.rest-client.prometheus.url=http://prometheus:9090
# Template LogQL de correlação por trace_id (placeholder %s); finalizado na validação T-405.
horus.query.loki.logql-template={service_namespace="medrec"} | trace_id="%s"
# Busca por janela temporal (T-1001): LogQL dos logs de erro e serviços internos do Jaeger
# ignorados quando a busca de traces não filtra por serviço.
horus.query.loki.error-logql={service_namespace="medrec"} | severity_text=~"(?i)(error|fatal)"
horus.query.jaeger.excluded-services=jaeger,jaeger-all-in-one,jaeger-query

# --- Camada de IA (Quarkus LangChain4j / Anthropic — ADR-0011, T-601) ---
# Desligada por padrão: sem chave, o StubLlmEngine responde (app sobe e CI roda verde).
# Habilite com horus.ai.enabled=true + ANTHROPIC_API_KEY para usar o motor real.
horus.ai.enabled=false
quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY:dummy-key}
# Modelo default (RCA profunda — Opus); roteamento por camada (Haiku/Sonnet/Opus) é fatia seguinte.
quarkus.langchain4j.anthropic.chat-model.model-name=claude-opus-4-8
quarkus.langchain4j.anthropic.timeout=60s
# Orçamento de tokens do montador de contexto da IA (T-602, RNF-H-003).
horus.ai.context.max-tokens=4000

# Resumo de estado agendado (T-603, RF-H-005). `off` desabilita; ex.: "0 0/15 * * * ?".
horus.ai.summary.cron=off
horus.ai.summary.promql=up
# Janela do resumo agendado e limites da coleta por janela (T-1001).
horus.ai.summary.lookback=15m
horus.ai.window.trace-limit=50
horus.ai.window.log-limit=50

# Cache de respostas do LLM (T-608, RNF-H-003/004) — reduz custo e latência.
horus.ai.cache.enabled=true
horus.ai.cache.max-entries=200
# Não injetar ChatModel automaticamente quando a IA está desligada.
quarkus.langchain4j.chat-model.provider=anthropic

# --- Alertas do Horus (T-703, RF-H-013) ---
# Em anomalias/erros críticos o Horus resume via IA e dispara aos canais habilitados.
# O canal `log` está sempre ativo. Webhook e e-mail ativam quando configurados:
horus.alert.webhook.url=
horus.alert.email.to=

# --- RBAC do Horus (T-704, RNF-H-010) ---
# Desligado por padrão: sem auth, o painel/telemetria/IA ficam abertos (dev/CI). Ligue
# com horus.rbac.enabled=true; o papel do chamador vem do cabeçalho X-Horus-Role nesta
# fatia (OIDC/JWT é fatia posterior). Papéis: PLATFORM_ADMIN, SRE, DEVELOPER, AUDITOR,
# LOAD_TEST_OP (ver docs/ROLES.md).
horus.rbac.enabled=false
