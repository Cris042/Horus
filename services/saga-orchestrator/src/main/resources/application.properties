# SAGA Orchestrator — T-107 (ADR-0013).
# service.name canônico (contrato T-005): saga-orchestrator (namespace medrec).

quarkus.application.name=saga-orchestrator
quarkus.http.port=8084

# --- Estado da SAGA (PostgreSQL dedicado: saga_db) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=horus
quarkus.datasource.password=horus
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5435/saga_db
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres-saga:5432/saga_db
quarkus.datasource.devservices.image-name=postgres:17.2-alpine

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.clean-disabled=true

# --- Clients REST dos participantes da SAGA ---
%dev.quarkus.rest-client.payment-api.url=http://localhost:8082
%prod.quarkus.rest-client.payment-api.url=http://payment-service:8082
%dev.quarkus.rest-client.invoice-api.url=http://localhost:8083
%prod.quarkus.rest-client.invoice-api.url=http://invoice-service:8083
# Teste: URLs dummy (os clients são mockados via @InjectMock — sem HTTP real).
%test.quarkus.rest-client.payment-api.url=http://localhost:0
%test.quarkus.rest-client.invoice-api.url=http://localhost:0

# --- Observabilidade (contrato T-005) ---
quarkus.log.level=INFO
quarkus.log.console.json=true
quarkus.otel.resource.attributes=service.namespace=medrec,deployment.environment.name=${HORUS_ENV:dev}
%dev.quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
%prod.quarkus.otel.exporter.otlp.endpoint=http://otel-collector:4317
quarkus.datasource.jdbc.telemetry=true
%test.quarkus.otel.sdk.disabled=true

quarkus.smallrye-health.root-path=/q/health
