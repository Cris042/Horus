# Invoice Service — scaffold T-101.
# service.name canônico (contrato de telemetria T-005): invoice-service.

quarkus.application.name=invoice-service
quarkus.http.port=8083

# --- Persistência (PostgreSQL dedicado: invoice_db) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=horus
quarkus.datasource.password=horus

# Dev: conecta ao Postgres do docker-compose (T-003, porta 5434). Prod: host do serviço.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/invoice_db
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres-invoice:5432/invoice_db

# Schema é dono do Flyway; Hibernate não gera DDL (RF-028 detalha em T-105).
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# Teste: sem URL -> Quarkus Dev Services sobe um PostgreSQL efêmero (Testcontainers; requer
# Docker — disponível no runner de CI). É o único caminho que enriquece as entidades Panache
# sob JDK 25; o smoke valida boot + migração Flyway + REST/health.
quarkus.datasource.devservices.image-name=postgres:17.2-alpine

# Health: SmallRye expõe /q/health, /q/health/live e /q/health/ready.
quarkus.smallrye-health.root-path=/q/health


# --- Observabilidade (T-401, contrato de telemetria T-005) ---
# Logs JSON estruturados; quarkus-opentelemetry injeta trace_id/span_id no contexto de log.
quarkus.log.level=INFO
quarkus.log.console.json=true

# OTel: exporta OTLP para o Collector (ADR-0010). service.name = quarkus.application.name (canônico).
quarkus.otel.resource.attributes=service.namespace=medrec,deployment.environment.name=${HORUS_ENV:dev}
%dev.quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
%prod.quarkus.otel.exporter.otlp.endpoint=http://otel-collector:4317
# Spans por execução de SQL com db.query.text parametrizado (RF-H-002/RNF-H-002).
quarkus.datasource.jdbc.telemetry=true
# Teste: sem Collector disponível -> desliga o SDK OTel (não afeta os testes de fluxo).
%test.quarkus.otel.sdk.disabled=true
