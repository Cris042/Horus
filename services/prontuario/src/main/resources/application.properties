# Prontuário Service — scaffold T-101.
# service.name canônico (contrato de telemetria T-005): prontuario-service.

quarkus.application.name=prontuario-service
quarkus.http.port=8081

# --- Persistência (PostgreSQL dedicado: prontuario_db) ---
quarkus.datasource.db-kind=postgresql
# Credenciais segregadas por serviço (T-106, RNF-003). Em prod virão de secrets.
quarkus.datasource.username=prontuario_svc
quarkus.datasource.password=prontuario_pw

# Dev: conecta ao Postgres do docker-compose (T-003). Prod: host do serviço no compose/k8s.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/prontuario_db
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres-prontuario:5432/prontuario_db

# Schema é dono do Flyway; Hibernate não gera DDL (RF-028 detalha em T-105).
quarkus.hibernate-orm.schema-management.strategy=none
# Flyway — migrações independentes por banco (RF-028) e versionadas/reproduzíveis (RNF-015).
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
# Proteção: nunca permitir `clean` (evita drop acidental do schema fora de dev).
quarkus.flyway.clean-disabled=true

# Teste: sem URL -> Quarkus Dev Services sobe um PostgreSQL efêmero (Testcontainers; requer
# Docker — disponível no runner de CI). É o único caminho que enriquece as entidades Panache
# sob JDK 25; o smoke valida boot + migração Flyway + REST/health.
quarkus.datasource.devservices.image-name=postgres:17.2-alpine

# Health: SmallRye expõe /q/health, /q/health/live e /q/health/ready.
quarkus.smallrye-health.root-path=/q/health


# --- Observabilidade (T-401, contrato de telemetria T-005) ---
# Logs JSON estruturados; quarkus-opentelemetry injeta trace_id/span_id no contexto de log.
quarkus.log.level=INFO
quarkus.log.console.json=true

# OTel: exporta OTLP para o Collector (ADR-0010). service.name = quarkus.application.name (canônico).
quarkus.otel.resource.attributes=service.namespace=medrec,deployment.environment.name=${HORUS_ENV:dev}
%dev.quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
%prod.quarkus.otel.exporter.otlp.endpoint=http://otel-collector:4317
# Métricas (RED mínimo, contrato T-005 §5): desligadas por padrão na extensão OTel do
# Quarkus (quarkus.otel.metrics.enabled=false) — habilita http.server.request.duration e
# db.client.operation.duration para o Prometheus via o mesmo endpoint OTLP acima.
quarkus.otel.metrics.enabled=true
# Spans por execução de SQL com db.query.text parametrizado (RF-H-002/RNF-H-002).
quarkus.datasource.jdbc.telemetry=true
# Teste: sem Collector disponível -> desliga o SDK OTel (não afeta os testes de fluxo).
%test.quarkus.otel.sdk.disabled=true
