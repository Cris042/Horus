[package]
name = "horus-report-worker"
version = "0.1.0"
edition = "2021"
description = "Worker Rust: consome solicitações de relatório do RabbitMQ, gera o relatório e envia e-mail (T-303, RF-022..024)."

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
lapin = "2.5"
tokio-executor-trait = "2"
tokio-reactor-trait = "1"
futures-lite = "2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# OTel (T-403, RF-029/RF-H-004): tracing→OTel + exportador OTLP/HTTP (sem protoc/gRPC) +
# propagação W3C extraída dos headers AMQP (fronteira HTTP→AMQP).
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
opentelemetry-semantic-conventions = "0.27"
tracing-opentelemetry = "0.28"

[[bin]]
name = "horus-report-worker"
path = "src/main.rs"
