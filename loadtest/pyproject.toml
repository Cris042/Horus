[project]
name = "horus-loadtest"
version = "0.1.0"
description = "API de controle de teste de carga do Horus (FastAPI) — T-202, RF-001..003"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118,<0.119",
    "uvicorn>=0.34,<0.35",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
# Geração de carga (Locust) chega em T-203; mantida fora das deps base por enquanto.
load = [
    "locust>=2.32,<3",
    "httpx>=0.28,<0.29",
]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.28,<0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
