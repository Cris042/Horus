[project]
name = "horus-loadtest"
version = "0.1.0"
description = "API de controle de teste de carga do Horus (FastAPI) — T-202, RF-001..003"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118,<0.119",
    "uvicorn>=0.34,<0.35",
    "pydantic>=2.11,<3",
    # Telemetria OTel (T-402, RF-029): SDK + exportador OTLP + auto-instrumentação FastAPI.
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[project.optional-dependencies]
load = [
    "locust>=2.32,<3",
    "httpx>=0.28,<0.29",
    # Injeta W3C traceparent nas chamadas HTTP do Locust (borda do trace — T-402).
    "opentelemetry-instrumentation-requests>=0.48b0",
]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.28,<0.29",
    "locust>=2.32,<3",
    "opentelemetry-instrumentation-requests>=0.48b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
