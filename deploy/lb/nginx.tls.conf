# Horus — Load Balancer de entrada, variante com TLS (T-901, RNF-017).
#
# Opt-in: mesma topologia/roteamento de `nginx.conf` (T-201), mas com um `server` HTTPS (443)
# adicional e redirecionamento 80→443. Use no lugar de `nginx.conf` quando quiser TLS na borda
# (ver `deploy/lb/README.md` — como gerar um certificado de dev e montar um real em produção).
# Requer `tls.crt`/`tls.key` montados em `/etc/nginx/tls/`.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format horus_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream":"$upstream_addr",'
        '"traceparent":"$http_traceparent"}';
    access_log /var/log/nginx/access.log horus_json;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # `traceparent`/`tracestate` são encaminhados por padrão (não há `proxy_set_header` limpando-os).

    # HTTP → redireciona para HTTPS (mantém /healthz acessível sem TLS para probes simples).
    server {
        listen 80;

        location = /healthz {
            access_log off;
            return 200 "lb ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        include locations.conf;
    }
}
