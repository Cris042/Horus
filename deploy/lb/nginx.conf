# Horus — Load Balancer de entrada (T-201, RF-005/RNF-006).
#
# NGINX como ponto único de entrada do sistema observado: recebe as chamadas e as roteia,
# por prefixo de caminho, aos serviços de domínio (e ao orquestrador de SAGA).
#
# ⚠️ OBSERVABILIDADE (contrato T-005 §2 / RF-029): o LB **repassa** o W3C `traceparent`/
# `tracestate` aos upstreams e **NÃO encerra** o contexto de trace. O NGINX encaminha os
# headers do cliente por padrão; este arquivo apenas garante isso e não os remove.
#
# Resolução de nomes em **tempo de requisição** (resolver + variável no proxy_pass): os
# serviços podem reiniciar/escalar sem recarregar o NGINX, e o DNS do orquestrador faz o
# balanceamento entre réplicas (RNF-006). Nomes = topologia containerizada (T-801).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # DNS interno do Docker Compose (127.0.0.11). Em Kubernetes, usar o DNS do cluster.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Repassa o contexto de trace e metadados de origem aos upstreams (não encerra o trace).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # `traceparent`/`tracestate` são encaminhados por padrão (não há `proxy_set_header` limpando-os).

    server {
        listen 80;

        # Roteamento por prefixo de caminho → serviço dono do recurso. A variável no `proxy_pass`
        # adia a resolução do nome para o tempo de requisição (resolver acima) e preserva a URI.
        location /prontuarios {
            set $up http://prontuario-service:8081;
            proxy_pass $up;
        }
        location /consultas {
            set $up http://prontuario-service:8081;
            proxy_pass $up;
        }

        location /carteiras {
            set $up http://payment-service:8082;
            proxy_pass $up;
        }
        location /pagamentos {
            set $up http://payment-service:8082;
            proxy_pass $up;
        }

        location /notas {
            set $up http://invoice-service:8083;
            proxy_pass $up;
        }

        location /sagas {
            set $up http://saga-orchestrator:8084;
            proxy_pass $up;
        }

        # Saúde do próprio LB (os /q/health dos serviços são acessados diretamente).
        location = /healthz {
            access_log off;
            return 200 "lb ok\n";
        }

        location / {
            return 404 "Horus LB: rota nao mapeada\n";
        }
    }
}
