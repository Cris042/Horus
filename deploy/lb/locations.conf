# Horus — roteamento por prefixo (T-201), compartilhado entre os `server` HTTP (nginx.conf)
# e HTTPS (nginx.tls.conf, T-901). Mudar uma rota aqui vale para os dois.

location /prontuarios {
    set $up http://prontuario-service:8081;
    proxy_pass $up;
}
location /consultas {
    set $up http://prontuario-service:8081;
    proxy_pass $up;
}

location /carteiras {
    set $up http://payment-service:8082;
    proxy_pass $up;
}
location /pagamentos {
    set $up http://payment-service:8082;
    proxy_pass $up;
}

location /notas {
    set $up http://invoice-service:8083;
    proxy_pass $up;
}

location /sagas {
    set $up http://saga-orchestrator:8084;
    proxy_pass $up;
}

# Saúde do próprio LB (os /q/health dos serviços são acessados diretamente).
location = /healthz {
    access_log off;
    return 200 "lb ok\n";
}

location / {
    return 404 "Horus LB: rota nao mapeada\n";
}
