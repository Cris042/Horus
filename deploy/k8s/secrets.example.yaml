# Template de Secrets (T-802, RF-033). ⚠️ EXEMPLO — não commitar segredos reais.
#
# Copie para `secrets.yaml` (gitignored) e substitua os valores, ou gere via:
#   kubectl -n horus create secret generic horus-db-secret \
#     --from-literal=PRONTUARIO_DB_USERNAME=... --from-literal=PRONTUARIO_DB_PASSWORD=... [...]
# Os valores abaixo são os de DEV (não-secretos) do docker-compose, só para subir local.
apiVersion: v1
kind: Secret
metadata:
  name: horus-db-secret
  namespace: horus
  labels:
    app.kubernetes.io/part-of: horus
type: Opaque
stringData:
  PRONTUARIO_DB_USERNAME: "prontuario_svc"
  PRONTUARIO_DB_PASSWORD: "prontuario_pw"
  PAYMENT_DB_USERNAME: "payment_svc"
  PAYMENT_DB_PASSWORD: "payment_pw"
  INVOICE_DB_USERNAME: "invoice_svc"
  INVOICE_DB_PASSWORD: "invoice_pw"
  SAGA_DB_USERNAME: "saga_svc"
  SAGA_DB_PASSWORD: "saga_pw"
---
apiVersion: v1
kind: Secret
metadata:
  name: horus-ai-secret
  namespace: horus
  labels:
    app.kubernetes.io/part-of: horus
type: Opaque
stringData:
  # Sem chave o Horus usa o StubLlmEngine; descomente e defina para habilitar a IA real (T-601+).
  # ⚠️ Não deixe a chave como string vazia: o Quarkus trata "" como valor definido e o Horus
  # falha ao subir (o default `dummy-key` só vale quando a variável está AUSENTE) — T-1002.
  # ANTHROPIC_API_KEY: "sk-ant-..."
