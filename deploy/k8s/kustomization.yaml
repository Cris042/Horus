# Kustomize base dos workloads de aplicação do Horus (T-802, RF-033).
#
# Aplica: namespace + config + secret (exemplo) + Deployments/Services dos 7 executáveis + LB.
# A infraestrutura (Postgres ×4, RabbitMQ, OTel Collector, Jaeger, Loki, Prometheus) vem de
# `deploy/kustomization.yaml` (T-1009): `kubectl apply -k deploy/` sobe o stack completo;
# `kubectl apply -k deploy/k8s/` continua subindo só as aplicações (infra externa). Em produção, troque `secrets.example.yaml` por um Secret
# gerenciado (sealed-secrets/external-secrets) e ajuste as tags via `images:` abaixo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: horus

resources:
  - namespace.yaml
  - config.yaml
  - secrets.example.yaml
  - apps/prontuario-service.yaml
  - apps/payment-service.yaml
  - apps/invoice-service.yaml
  - apps/saga-orchestrator.yaml
  - apps/horus.yaml
  - apps/report-worker.yaml
  - apps/loadtest.yaml
  # LB de entrada no cluster (T-1009) — alvo padrão da API de carga.
  - apps/load-balancer.yaml
  # Ponto único de entrada externo, com TLS opcional (T-901, RNF-017).
  - apps/ingress.yaml
  # Escala horizontal por componente (T-803, RNF-005).
  - autoscaling/prontuario-service-hpa.yaml
  - autoscaling/payment-service-hpa.yaml
  - autoscaling/invoice-service-hpa.yaml
  - autoscaling/saga-orchestrator-hpa.yaml
  - autoscaling/horus-hpa.yaml
  - autoscaling/report-worker-hpa.yaml

configMapGenerator:
  - name: load-balancer-config
    files:
      - lb/nginx.conf
      - lb/locations.conf

# Sobrescreva a tag das imagens (default `dev`) sem editar cada manifesto:
#   kustomize edit set image horus/horus=horus/horus:0.1.0
images:
  - name: horus/prontuario
    newTag: dev
  - name: horus/payment
    newTag: dev
  - name: horus/invoice
    newTag: dev
  - name: horus/saga-orchestrator
    newTag: dev
  - name: horus/horus
    newTag: dev
  - name: horus/report-worker
    newTag: dev
  - name: horus/loadtest
    newTag: dev

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
