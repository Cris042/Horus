# HPA do invoice-service (T-803, RNF-005): escala horizontal independente por componente,
# dirigida por utilização média de CPU (requests definidos no Deployment do T-802).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: invoice-service
  namespace: horus
  labels:
    app.kubernetes.io/name: invoice-service
    app.kubernetes.io/part-of: horus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: invoice-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
