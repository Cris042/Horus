# HPA do report-worker (T-803, RNF-005): escala horizontal independente por componente,
# dirigida por utilização média de CPU (requests definidos no Deployment do T-802).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: report-worker
  namespace: horus
  labels:
    app.kubernetes.io/name: report-worker
    app.kubernetes.io/part-of: horus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: report-worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
