# API de teste de carga (FastAPI) — T-802, RF-033.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadtest
  namespace: horus
  labels:
    app.kubernetes.io/name: loadtest
    app.kubernetes.io/part-of: horus
    app.kubernetes.io/component: loadtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadtest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadtest
        app.kubernetes.io/part-of: horus
        app.kubernetes.io/component: loadtest
    spec:
      containers:
        - name: loadtest
          image: horus/loadtest:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: horus-config
          env:
            # T-1009: gerar carga de verdade e instrumentar a borda (mesmo que o compose).
            - name: HORUS_LOADTEST_RUNNER
              value: "locust"
            - name: HORUS_OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: loadtest
  namespace: horus
  labels:
    app.kubernetes.io/name: loadtest
    app.kubernetes.io/part-of: horus
spec:
  selector:
    app.kubernetes.io/name: loadtest
  ports:
    - name: http
      port: 8000
      targetPort: http
