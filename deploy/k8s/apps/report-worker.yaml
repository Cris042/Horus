# Worker Rust de relatório/e-mail (T-802, RF-033).
# Implantado SEPARADO dos serviços de domínio (ADR-0012 / T-804). Consumidor RabbitMQ:
# sem porta HTTP / sem Service (não recebe tráfego de entrada).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-worker
  namespace: horus
  labels:
    app.kubernetes.io/name: report-worker
    app.kubernetes.io/part-of: horus
    app.kubernetes.io/component: worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: report-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: report-worker
        app.kubernetes.io/part-of: horus
        app.kubernetes.io/component: worker
    spec:
      affinity:
        nodeAffinity:
          # ADR-0012 / T-804: prefere nos do pool "platform" (soft, nao bloqueia sem labels).
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: horus.io/tier
                    operator: In
                    values: ["platform"]
      containers:
        - name: report-worker
          image: horus/report-worker:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: horus-config
          env:
            # Conexão com a mensageria (mesmos defaults do compose de dev). T-1009: o worker lê
            # AMQP_URL (antes RABBITMQ_ADDR — ignorado, o worker tentava localhost:5672).
            - name: AMQP_URL
              value: "amqp://horus:horus@rabbitmq:5672/%2f"
            # O worker exporta OTLP/HTTP (4318), não o gRPC do ConfigMap dos serviços Quarkus.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "128Mi" }
