# Load Balancer de entrada no cluster (T-1009; T-201/ADR-0002). É o `http://load-balancer` que a
# API de carga usa por padrão — antes não existia em K8s (só o Ingress, que exige um controller e
# não atende o tráfego interno do loadtest). Config em k8s/lb/ (configMapGenerator).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-balancer
  namespace: horus
  labels:
    app.kubernetes.io/name: load-balancer
    app.kubernetes.io/part-of: horus
    app.kubernetes.io/component: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: load-balancer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-balancer
        app.kubernetes.io/part-of: horus
        app.kubernetes.io/component: edge
    spec:
      # T-1009: sem as env vars de "service links" (ex.: RABBITMQ_PORT=tcp://…) que o K8s
      # injeta por Service do namespace — o Quarkus as lê como config e o invoice caía.
      enableServiceLinks: false
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: config
              mountPath: /etc/nginx/locations.conf
              subPath: locations.conf
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits: { cpu: "500m", memory: "128Mi" }
      volumes:
        - name: config
          configMap:
            name: load-balancer-config
---
apiVersion: v1
kind: Service
metadata:
  name: load-balancer
  namespace: horus
  labels:
    app.kubernetes.io/name: load-balancer
    app.kubernetes.io/part-of: horus
spec:
  selector:
    app.kubernetes.io/name: load-balancer
  ports:
    - name: http
      port: 80
      targetPort: http
