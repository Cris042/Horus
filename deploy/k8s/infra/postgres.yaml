# Postgres ×4 no cluster (T-1009) — um StatefulSet por banco (RNF-002/003: banco e credencial
# isolados por serviço, como no compose). Credenciais do Secret horus-db-secret (secrets.example.yaml).
# Nomes de Service = hosts do profile prod dos serviços Quarkus (postgres-<dominio>).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-prontuario
  labels: { app.kubernetes.io/name: postgres-prontuario, app.kubernetes.io/component: database }
spec:
  serviceName: postgres-prontuario
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres-prontuario }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres-prontuario, app.kubernetes.io/component: database }
    spec:
      containers:
        - name: postgres
          image: postgres:17.2-alpine
          ports: [{ name: pg, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: prontuario_db }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: horus-db-secret, key: PRONTUARIO_DB_USERNAME } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: horus-db-secret, key: PRONTUARIO_DB_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-prontuario
  labels: { app.kubernetes.io/name: postgres-prontuario }
spec:
  selector: { app.kubernetes.io/name: postgres-prontuario }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
---
