# RabbitMQ no cluster (T-1009) — mensageria restrita a relatórios (ADR-0004). Credenciais de dev
# iguais às do compose (horus/horus); em produção, use um Secret gerenciado.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/component: messaging }
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/component: messaging }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.0-management-alpine
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: horus }
            - { name: RABBITMQ_DEFAULT_PASS, value: horus }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts: [{ name: data, mountPath: /var/lib/rabbitmq }]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: { app.kubernetes.io/name: rabbitmq }
spec:
  selector: { app.kubernetes.io/name: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: management, port: 15672, targetPort: management }
