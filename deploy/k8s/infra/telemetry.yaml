# Pipeline de telemetria no cluster (T-1009, ADR-0010): OTel Collector → Jaeger / Loki /
# Prometheus. As configs são as MESMAS do compose (deploy/telemetry/*, via configMapGenerator em
# deploy/kustomization.yaml), exceto o Prometheus (prometheus-k8s.yml: sem alvos só-compose).
# Retenção por sinal (T-1005): JAEGER_RETENTION / LOKI_RETENTION / PROMETHEUS_RETENTION abaixo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels: { app.kubernetes.io/name: otel-collector, app.kubernetes.io/component: telemetry }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-collector, app.kubernetes.io/component: telemetry }
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.118.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: health, containerPort: 13133 }
          readinessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 5
          volumeMounts: [{ name: config, mountPath: /etc/otelcol }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
      volumes:
        - name: config
          configMap: { name: otel-collector-config, items: [{ key: otel-collector-config.yaml, path: config.yaml }] }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels: { app.kubernetes.io/name: otel-collector }
spec:
  selector: { app.kubernetes.io/name: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/component: telemetry }
spec:
  replicas: 1
  strategy: { type: Recreate }   # Badger usa trava de arquivo: nunca 2 pods no mesmo volume
  selector:
    matchLabels: { app.kubernetes.io/name: jaeger }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/component: telemetry }
    spec:
      securityContext: { fsGroup: 10001 }   # Jaeger roda como uid 10001: volume gravável
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.2.0
          args: ["--config", "/etc/jaeger/config.yaml"]
          env: [{ name: JAEGER_RETENTION, value: "168h" }]
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: health, containerPort: 13133 }
          readinessProbe:
            httpGet: { path: /status, port: health }
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /etc/jaeger }
            - { name: data, mountPath: /badger }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: config
          configMap: { name: jaeger-config, items: [{ key: jaeger-config.yaml, path: config.yaml }] }
        - name: data
          persistentVolumeClaim: { claimName: jaeger-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels: { app.kubernetes.io/name: jaeger }
spec:
  selector: { app.kubernetes.io/name: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: ui }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels: { app.kubernetes.io/name: loki, app.kubernetes.io/component: telemetry }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: loki }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loki, app.kubernetes.io/component: telemetry }
    spec:
      securityContext: { fsGroup: 10001 }
      containers:
        - name: loki
          image: grafana/loki:3.4.1
          args: ["-config.file=/etc/loki/loki-config.yaml", "-config.expand-env=true"]
          env: [{ name: LOKI_RETENTION, value: "168h" }]
          ports: [{ name: http, containerPort: 3100 }]
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /tmp/loki }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          persistentVolumeClaim: { claimName: loki-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: { app.kubernetes.io/name: loki }
spec:
  selector: { app.kubernetes.io/name: loki }
  ports: [{ name: http, port: 3100, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/component: telemetry }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/component: telemetry }
    spec:
      securityContext: { fsGroup: 65534 }   # imagem roda como nobody
      containers:
        - name: prometheus
          image: prom/prometheus:v3.2.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-remote-write-receiver
            - --storage.tsdb.retention.time=15d
          ports: [{ name: http, containerPort: 9090 }]
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: config
          configMap: { name: prometheus-config, items: [{ key: prometheus-k8s.yml, path: prometheus.yml }] }
        - name: data
          persistentVolumeClaim: { claimName: prometheus-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus }
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
