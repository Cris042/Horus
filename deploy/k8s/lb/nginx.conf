# Horus — Load Balancer de entrada (T-201, RF-005/RNF-006).
#
# NGINX como ponto único de entrada do sistema observado: recebe as chamadas e as roteia,
# por prefixo de caminho, aos serviços de domínio (e ao orquestrador de SAGA).
#
# ⚠️ OBSERVABILIDADE (contrato T-005 §2 / RF-029): o LB **repassa** o W3C `traceparent`/
# `tracestate` aos upstreams e **NÃO encerra** o contexto de trace. O NGINX encaminha os
# headers do cliente por padrão; este arquivo apenas garante isso e não os remove.
#
# VARIANTE KUBERNETES (T-1009) de deploy/lb/nginx.conf: mesmo log/headers, mas os upstreams são
# os Services do cluster (ClusterIP estável — o kube-proxy balanceia entre réplicas, RNF-006),
# resolvidos no boot pelo resolv.conf do pod (com os search domains do namespace). As rotas
# espelham deploy/lb/locations.conf e o Ingress (apps/ingress.yaml).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Access log JSON com o W3C traceparent (T-402, contrato T-005 §5): permite ao Horus
    # correlacionar a entrada no LB com o trace ponta a ponta. O LB NÃO encerra o trace —
    # apenas o registra e repassa. `traceparent` vazio quando o cliente não o envia.
    log_format horus_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream":"$upstream_addr",'
        '"traceparent":"$http_traceparent"}';
    access_log /dev/stdout horus_json;

    # Repassa o contexto de trace e metadados de origem aos upstreams (não encerra o trace).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # `traceparent`/`tracestate` são encaminhados por padrão (não há `proxy_set_header` limpando-os).

    server {
        listen 80;

        # Roteamento por prefixo de caminho → serviço dono do recurso (T-901: extraído para
        # snippet compartilhado com o `server` HTTPS opcional de `nginx.tls.conf`).
        include /etc/nginx/locations.conf;
    }
}
