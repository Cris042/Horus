# Horus — rotas do LB no Kubernetes (T-1009). Espelha deploy/lb/locations.conf (compose), com
# proxy_pass estático (Services ClusterIP) em vez de variável + resolver do Docker.

location /prontuarios {
    proxy_pass http://prontuario-service:8081;
}
location /consultas {
    proxy_pass http://prontuario-service:8081;
}

location /carteiras {
    proxy_pass http://payment-service:8082;
}
location /pagamentos {
    proxy_pass http://payment-service:8082;
}

location /notas {
    proxy_pass http://invoice-service:8083;
}

location /sagas {
    proxy_pass http://saga-orchestrator:8084;
}

# Saúde do próprio LB (os /q/health dos serviços são acessados diretamente).
location = /healthz {
    access_log off;
    return 200 "lb ok\n";
}

location / {
    return 404 "Horus LB: rota nao mapeada\n";
}
