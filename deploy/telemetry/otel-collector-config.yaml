# OpenTelemetry Collector (contrib) — config de DEV (T-003, ADR-0010)
#
# Único ponto de ingestão OTLP do projeto: recebe traces/logs/métricas de todos os
# componentes e roteia para os backends — Jaeger (traces), Loki (logs), Prometheus (métricas).
# A redação/sanitização de borda mais profunda (PII) é endereçada em T-406; aqui fica o
# roteamento mínimo que faz `make up` entregar um pipeline funcional ponta a ponta.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

extensions:
  # Endpoint de liveness do Collector (consumido pelo healthcheck do compose — T-404)
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  batch:
    timeout: 5s
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

  # Redação de PII na BORDA (T-406, RNF-010/RNF-H-002, CONTRACT §6).
  # Segunda camada de defesa em profundidade: a 1ª é na ORIGEM (serviços, T-401 —
  # SQL parametrizado, sem valores crus). Aqui reforçamos sobre spans e logs:
  #  (a) removemos chaves proibidas de atributos;
  #  (b) mascaramos e-mail / CPF / cartão que vazem em valores ou no corpo do log.
  # `error_mode: ignore` => uma falha de OTTL nunca derruba o sinal.
  transform/pii:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "cpf")
          - delete_key(attributes, "documento")
          - delete_key(attributes, "email")
          - delete_key(attributes, "nome_paciente")
          - delete_key(attributes, "cartao")
          - delete_key(attributes, "prontuario.conteudo")
          # e-mail -> ***@*** | CPF (com/sem pontuação) -> *** | cartão (13-19 díg.) -> ***
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "***@***")
          - replace_all_patterns(attributes, "value", "\\b\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}\\b", "***")
          - replace_all_patterns(attributes, "value", "\\b\\d{13,19}\\b", "***")
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "cpf")
          - delete_key(attributes, "documento")
          - delete_key(attributes, "email")
          - delete_key(attributes, "nome_paciente")
          - delete_key(attributes, "cartao")
          - delete_key(attributes, "prontuario.conteudo")
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "***@***")
          - replace_all_patterns(attributes, "value", "\\b\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}\\b", "***")
          - replace_all_patterns(attributes, "value", "\\b\\d{13,19}\\b", "***")
          # corpo do log (Quarkus emite linha JSON como string)
          - replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "***@***") where IsString(body)
          - replace_pattern(body, "\\b\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}\\b", "***") where IsString(body)

exporters:
  # Traces → Jaeger (via OTLP nativo do Jaeger 2)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Logs → Loki (via OTLP HTTP; Loki 3 aceita OTLP em /otlp)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  # Métricas → Prometheus (via remote_write; receiver habilitado no Prometheus)
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/pii, batch]
      exporters: [otlp/jaeger]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/pii, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
  telemetry:
    logs:
      level: info
