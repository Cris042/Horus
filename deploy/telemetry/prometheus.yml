# Prometheus — config de DEV (T-003, ADR-0010)
#
# Em dev as métricas de app chegam por **remote_write** a partir do OTel Collector
# (`--web.enable-remote-write-receiver`), então não há `scrape_configs` de apps aqui.
# Os bancos são a exceção: `postgres_exporter` (1 por banco) é raspado (scrape) direto,
# padrão do ecossistema Prometheus para métricas de infraestrutura de terceiros.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter-prontuario:9187"]
        labels: { database: prontuario_db }
      - targets: ["postgres-exporter-payment:9187"]
        labels: { database: payment_db }
      - targets: ["postgres-exporter-invoice:9187"]
        labels: { database: invoice_db }
      - targets: ["postgres-exporter-saga:9187"]
        labels: { database: saga_db }
