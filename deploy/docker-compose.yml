# Horus — docker-compose de DESENVOLVIMENTO (T-003, RF-032)
#
# Sobe a infraestrutura local do sistema observado + backends de telemetria:
#   - PostgreSQL ×4: prontuario_db, payment_db, invoice_db, saga_db
#   - RabbitMQ 4.0 (com management) — mensageria restrita a relatórios (ADR-0004)
#   - OpenTelemetry Collector (contrib) — único ponto de ingestão OTLP (ADR-0010)
#   - Jaeger 2 (traces), Loki 3 (logs), Prometheus 3 (métricas)
#
# Uso: `make up` / `make down` (na raiz do repo). As aplicações (Quarkus/Rust/Python)
# ainda NÃO entram aqui — entram em T-801, quando houver imagens Docker.
#
# ⚠️ Versões fixadas para reprodutibilidade (ver lib.md). Confirme/ajuste ao evoluir.
# ⚠️ Credenciais abaixo são de DEV (não-secretas, locais). Nunca usar em prod.

name: horus-dev

x-postgres-common: &postgres-common
  image: postgres:17.2-alpine
  restart: unless-stopped
  # Credenciais SEGREGADAS por serviço (RNF-003): cada banco é uma instância isolada com seu
  # próprio usuário/senha (definidos em cada serviço). Healthcheck usa o usuário do serviço.
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks: [horus]

services:
  # ---------------------------------------------------------------- Bancos (1 por serviço)
  postgres-prontuario:
    <<: *postgres-common
    environment:
      POSTGRES_USER: prontuario_svc
      POSTGRES_PASSWORD: prontuario_pw
      POSTGRES_DB: prontuario_db
    ports: ["5432:5432"]
    volumes: ["pg-prontuario:/var/lib/postgresql/data"]

  postgres-payment:
    <<: *postgres-common
    environment:
      POSTGRES_USER: payment_svc
      POSTGRES_PASSWORD: payment_pw
      POSTGRES_DB: payment_db
    ports: ["5433:5432"]
    volumes: ["pg-payment:/var/lib/postgresql/data"]

  postgres-invoice:
    <<: *postgres-common
    environment:
      POSTGRES_USER: invoice_svc
      POSTGRES_PASSWORD: invoice_pw
      POSTGRES_DB: invoice_db
    ports: ["5434:5432"]
    volumes: ["pg-invoice:/var/lib/postgresql/data"]

  postgres-saga:
    <<: *postgres-common
    environment:
      POSTGRES_USER: saga_svc
      POSTGRES_PASSWORD: saga_pw
      POSTGRES_DB: saga_db
    ports: ["5435:5432"]
    volumes: ["pg-saga:/var/lib/postgresql/data"]

  # ---------------------------------------------------------------- Mensageria (relatórios)
  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: horus
      RABBITMQ_DEFAULT_PASS: horus
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks: [horus]

  # ---------------------------------------------------------------- Telemetria: backends
  jaeger:
    image: jaegertracing/jaeger:2.2.0
    restart: unless-stopped
    ports:
      - "16686:16686"  # UI (RF-031)
    networks: [horus]

  loki:
    image: grafana/loki:3.4.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./telemetry/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [horus]

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"   # recebe métricas do Collector via remote_write
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [horus]

  # ---------------------------------------------------------------- Telemetria: ingestão (OTLP)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./telemetry/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC  (apps emitem aqui)
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # health_check (extensão — liveness)
    depends_on:
      jaeger:
        condition: service_started
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    networks: [horus]

  # ---------------------------------------------------------------- Telemetria: visualização
  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true        # dev: sem login
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      # Datasources provisionados no boot (Prometheus, Loki, Jaeger)
      - ./telemetry/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"   # UI (RF-031)
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks: [horus]

volumes:
  pg-prontuario:
  pg-payment:
  pg-invoice:
  pg-saga:

networks:
  horus:
    driver: bridge
